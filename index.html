<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halk Oyunları Sözlüğüm | Yaman Hoşcan</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#624a3c,#241a17 75%);color:#fff4df;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}header{text-align:center;padding:22px 12px 8px}h1{font-size:clamp(22px,4.5vw,36px);margin:0 0 4px}header p{margin:0;color:#e4c6a3}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:14px}.controls button{border:0;border-radius:9px;background:#f1d6a2;color:#342219;padding:12px 15px;font-weight:700;cursor:pointer;touch-action:manipulation}.controls button:disabled{opacity:.45;cursor:not-allowed}.controls button:focus-visible{outline:3px solid #fff}#count{align-self:center;min-width:95px;text-align:center}.stage{display:flex;align-items:center;justify-content:center;padding:10px 12px 30px;perspective:1600px;min-height:55vh}.sheet{position:relative;width:min(92vw,560px);background:#f7e9cb;box-shadow:0 12px 35px #0009;border-radius:3px;overflow:hidden;transform-origin:left center;transition:transform .32s ease,opacity .32s ease;touch-action:pan-y;aspect-ratio:210/297}.sheet canvas{width:100%;height:100%;display:block}.sheet.turn-next{transform:rotateY(-68deg);opacity:.35}.sheet.turn-prev{transform:rotateY(68deg);opacity:.35}.message{position:absolute;inset:0;display:grid;place-items:center;color:#62412a;text-align:center;padding:20px}.hint{text-align:center;font-size:13px;color:#dfc8ad;padding:0 12px 20px}a{color:#ffdea7}@media(max-width:520px){header{padding-top:14px}.controls button{padding:10px 11px}.stage{padding:5px 8px 18px;min-height:0}.sheet{width:min(94vw,460px)}}@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style></head><body>
<header><h1>Halk Oyunları Sözlüğüm</h1><p>Yaman Hoşcan</p></header>
<div class="controls"><button id="first">📖 Başa dön</button><button id="prev">◀ Önceki</button><span id="count">Yükleniyor…</span><button id="next">Sonraki ▶</button><button id="music">♫ Müzik seç</button><input id="audioFile" type="file" accept="audio/*" hidden></div>
<main class="stage"><div class="sheet" id="sheet"><canvas id="page"></canvas><div id="message" class="message">Kitap yükleniyor…</div></div></main>
<div class="hint">Telefonda sağa veya sola kaydırarak sayfa değiştirebilirsin. Müzik seçimi yalnızca kendi cihazında çalar.</div>
<audio id="audio" loop></audio>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const pdfName='Yaman_Halk_Oyunlari_Sozlugum_Tam_27_Sayfa.pdf';
const $=id=>document.getElementById(id), canvas=$('page'),sheet=$('sheet'),msg=$('message'),count=$('count');
let pdf=null,current=1,busy=false,token=0;
function controls(){ $('prev').disabled=!pdf||current<=1||busy;$('first').disabled=!pdf||current<=1||busy;$('next').disabled=!pdf||current>=pdf.numPages||busy;count.textContent=pdf?`${current} / ${pdf.numPages}`:'Yükleniyor…';}
async function render(){const t=++token;const page=await pdf.getPage(current);const base=page.getViewport({scale:1});const dpr=Math.min(window.devicePixelRatio||1,2);const scale=Math.min(2.5,Math.max(1,(sheet.clientWidth/base.width)*dpr));const vp=page.getViewport({scale});if(t!==token)return;canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);sheet.style.aspectRatio=`${base.width}/${base.height}`;await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp}).promise;msg.hidden=true;controls();}
async function move(n){if(!pdf||busy||n<1||n>pdf.numPages||n===current)return;busy=true;controls();sheet.classList.add(n>current?'turn-next':'turn-prev');await new Promise(r=>setTimeout(r,310));current=n;try{await render()}catch(e){msg.hidden=false;msg.textContent='Sayfa açılamadı: '+e.message}sheet.classList.remove('turn-next','turn-prev');busy=false;controls();}
$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('first').onclick=()=>move(1);
let startX=0,startY=0;sheet.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});sheet.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)move(current+(dx<0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(current+1);if(e.key==='ArrowLeft')move(current-1)});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(pdf&&!busy)render().catch(()=>{})},250)});


const audio = $('audio');
const musicBtn = $('music');

audio.src = 'muzik.mp3';
audio.loop = true;
audio.preload = 'auto';

musicBtn.textContent = '🔇 Sesi Aç';

function updateMusicButton() {
  musicBtn.textContent = audio.paused ? '🔇 Sesi Aç' : '🔊 Sesi Kapat';
}

musicBtn.onclick = async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (e) {
      console.warn('Müzik başlatılamadı:', e);
    }
  } else {
    audio.pause();
  }
  updateMusicButton();
};

audio.addEventListener('play', updateMusicButton);
audio.addEventListener('pause', updateMusicButton);

// Sayfa açıldığında müziği otomatik başlatmayı dene.
audio.play().catch(() => {
  // Tarayıcı engellerse ziyaretçi Sesi Aç düğmesine basar.
  updateMusicButton();
});


try {
  pdf = await pdfjsLib.getDocument({url: encodeURI(pdfName)}).promise;
  await render();
  controls();
  msg.hidden = true;
  msg.style.display = 'none';
} catch(e) {
  msg.textContent = 'Hata: ' + e.message;
  msg.hidden = false;
}
</script></body></html>
