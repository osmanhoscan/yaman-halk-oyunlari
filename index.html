<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yaman | Halk Oyunları Sözlüğüm</title><style>body{margin:0;background:#352a25;color:#fff;font-family:system-ui;text-align:center}header{padding:15px}h1{font-size:clamp(20px,4vw,34px);margin:8px}.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px}button{background:#f3d8a2;border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer}.stage{display:flex;justify-content:center;align-items:center;min-height:65vh;padding:12px}#book{max-width:100%}.page{background:#f7ead2;overflow:hidden;display:flex;align-items:center;justify-content:center}.page img{width:100%;height:100%;object-fit:contain}.empty{color:#533e2e;padding:25px}small{color:#dcc9aa}</style></head><body><header><h1>Halk Oyunları Sözlüğüm</h1><div>Yaman Hoşcan</div><div class="toolbar"><button id="start">📖 Kitabı Aç</button><button id="prev">◀ Önceki</button><button id="next">Sonraki ▶</button><button id="music">♫ Müziği Aç</button></div><small id="status">Sayfaları yükledikten sonra kitabınız burada görünecek.</small></header><div class="stage"><div id="book"></div></div><audio id="audio" src="muzik.mp3" loop preload="none"></audio><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script><script>
const book=document.getElementById('book'),audio=document.getElementById('audio'),status=document.getElementById('status');let flip;const imgs=[];for(let i=1;i<=60;i++){imgs.push('sayfalar/'+String(i).padStart(2,'0')+'.jpg')}let count=0;Promise.all(imgs.map(src=>new Promise(resolve=>{let im=new Image();im.onload=()=>resolve(src);im.onerror=()=>resolve(null);im.src=src}))).then(all=>{const available=all.filter(Boolean);count=available.length;if(!count){book.innerHTML='<div class="page empty" style="width:min(75vw,420px);height:500px">Kitap sayfaları henüz eklenmedi.<br>sayfalar/01.jpg, 02.jpg ... olarak yükleyin.</div>';return}for(const src of available){const p=document.createElement('div');p.className='page';const img=document.createElement('img');img.src=src;img.alt='Kitap sayfası';p.append(img);book.append(p)}flip=new St.PageFlip(book,{width:480,height:680,size:'stretch',minWidth:250,maxWidth:480,minHeight:350,maxHeight:680,showCover:true,mobileScrollSupport:false,usePortrait:true,drawShadow:true,flippingTime:900});flip.loadFromHTML(document.querySelectorAll('.page'));status.textContent=count+' sayfa yüklendi';});function musicText(){document.getElementById('music').textContent=audio.paused?'♫ Müziği Aç':'♫ Müziği Kapat'}async function play(){try{await audio.play()}catch(e){status.textContent='Müzik için muzik.mp3 dosyasını yükleyin veya müzik düğmesine dokunun.'}musicText()}document.getElementById('start').onclick=()=>{if(flip)flip.turnToPage(0);play()};document.getElementById('music').onclick=()=>audio.paused?play():(audio.pause(),musicText());document.getElementById('prev').onclick=()=>flip?.flipPrev();document.getElementById('next').onclick=()=>flip?.flipNext();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')flip?.flipNext();if(e.key==='ArrowLeft')flip?.flipPrev()});</script></body></html>
